# Build the site and rsync it to the web host.
#
# This replaces running deploy.py from a laptop. Everything host-specific
# comes from repository secrets - DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD,
# DEPLOY_DEST, DEPLOY_HOST_KEY - so nothing here names the host or the paths
# on it.
#
# The host key is checked against DEPLOY_HOST_KEY. No --delete: the sync only
# adds and overwrites, so anything on the server the build does not produce is
# left alone.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would transfer, without writing anything
        type: boolean
        default: false

# One deploy at a time, and never cancel one midway through an rsync.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Keep in step with the version named in CLAUDE.md. Output is version
  # sensitive: 0.123.7 and 0.152.2 differ in the generator meta tag alone,
  # but an older Hugo also drops the generated /apps/ page entirely.
  HUGO_VERSION: 0.152.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo ${{ env.HUGO_VERSION }} extended
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" hugo
          sudo install -m 755 hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        run: |
          set -euo pipefail
          hugo
          test -f public/index.html
          test -f public/apps/index.html
          test -f public/apps/scrabble/script.js

      - name: Deploy
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DEST: ${{ secrets.DEPLOY_DEST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # DEPLOY_DEST is the one setting a typo makes expensive: rsync would
          # happily build a second copy of the site at the wrong path. Refuse
          # anything that is not recognisably the site root.
          if ! sshpass -e ssh \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "test -f '${DEPLOY_DEST}/index.html' && test -d '${DEPLOY_DEST}/apps'"; then
            echo "::error::DEPLOY_DEST ($DEPLOY_DEST) has no index.html and apps/ - refusing to sync"
            exit 1
          fi
          echo "destination looks like the site root"

          flags=(-avz --itemize-changes)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "::notice::dry run - nothing will be written"
            flags+=(--dry-run)
          fi
          sshpass -e rsync "${flags[@]}" \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DEST}"
